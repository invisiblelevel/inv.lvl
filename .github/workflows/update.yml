name: Deploy to GitHub Pages

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Забираем всю историю, чтобы git pull работал корректно

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run script to update site
        run: python app.py
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          CHANNEL_LINK: ${{ secrets.CHANNEL_LINK }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          # Подтягиваем последние изменения из удалённого репозитория (rebase, чтобы избежать лишних merge-коммитов)
          git pull --rebase origin main || true

          # Добавляем изменения
          git add public/ || true

          # Коммитим, если есть что коммитить
          git diff --staged --quiet || git commit -m "Auto-update site via GitHub Actions"

          # Пушим (с опцией force-with-lease для безопасности)
          git push origin main
