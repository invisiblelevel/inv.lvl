name: Deploy to GitHub Pages

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run script to update site
        run: python app.py
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          CHANNEL_LINK: ${{ secrets.CHANNEL_LINK }}

      - name: Commit and push changes
        run: |
          # Настраиваем Git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Подтягиваем последние изменения из удалённого репозитория
          git pull --rebase origin main

          # Добавляем новые файлы
          git add public/ posts.json || true

          # Если есть изменения — коммитим
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update site via GitHub Actions"
          else
            echo "No changes to commit"
          fi

          # Пушим изменения
          git push origin main
